# One-off helper: downloads the site's Canva-generated photos (listed in
# growth-framework/img-sources.json), resizes them for the web and commits them
# to growth-framework/public/img/. Safe to delete once the images are in.
name: Fetch site images
on:
  push:
    paths: ['growth-framework/img-sources.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Download and resize
        run: |
          python3 - <<'PY'
          import json, io, re, urllib.request
          from PIL import Image
          src = json.load(open('growth-framework/img-sources.json'))
          for key, thumb in src.items():
              variants = [
                  thumb.replace('height:112', 'height:944').replace('width:200', 'width:1680').replace('quality:75', 'quality:90').replace('&x-canva-quality=thumbnail', ''),
                  thumb.replace('height:112', 'height:944').replace('width:200', 'width:1680').replace('quality:75', 'quality:90'),
                  thumb.replace('&x-canva-quality=thumbnail', ''),
                  thumb,
              ]
              got = None
              for i, u in enumerate(variants):
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read()
                      im = Image.open(io.BytesIO(data)).convert('RGB')
                      print(key, 'variant', i, 'size', im.size)
                      if got is None or im.size[0] > got.size[0]:
                          got = im
                      if im.size[0] >= 1200:
                          break
                  except Exception as e:
                      print(key, 'variant', i, 'failed:', e)
              if got is None or got.size[0] < 1000:
                  print(key, 'SKIPPED: no full-size image available', got.size if got else None)
                  continue
              if got.size[0] > 1600:
                  got = got.resize((1600, round(got.size[1] * 1600 / got.size[0])), Image.LANCZOS)
              got.save(f'growth-framework/public/img/{key}.jpg', 'JPEG', quality=80, optimize=True, progressive=True)
              print(key, 'saved', got.size)
          PY
          ls -la growth-framework/public/img/
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-framework/public/img/*.jpg || true
          git diff --cached --quiet && echo "No new images" || (git commit -m "Add site photos from Canva" && git push)
